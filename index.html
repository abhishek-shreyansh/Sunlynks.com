<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunlynks - A Solar Company</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #667eea;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .subtitle {
            color: #764ba2;
            font-size: 1.5em;
            margin-bottom: 30px;
            font-weight: 300;
        }
        p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        .solar-icon {
            font-size: 100px;
            margin: 30px 0;
        }
        .status {
            color: #27ae60;
            font-size: 1.2em;
            margin-top: 30px;
            padding: 15px;
            background: #e8f8f5;
            border-radius: 8px;
            border-left: 4px solid #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="solar-icon">☀️</div>
        <h1>Sunlynks</h1>
        <p class="subtitle">A Solar Company</p>
        <p>Welcome to Sunlynks, your trusted partner in renewable energy solutions.</p>
        <p>We deliver innovative solar technology and sustainable energy solutions for a better tomorrow.</p>
        <div class="status">
            ✅ Website successfully published!
        </div>
    </div>
</body>
</html>
